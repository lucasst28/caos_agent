# CAOS - Cognitive Anomaly Observation System (Simplificado)
# docker-compose.yml
#
# Versão simplificada para Atlas:
# - Rate Limiting
# - Validação de payloads
# - Circuit Breaker
# - Auditoria
#
# SEM: ML (IsolationForest), LLM (GPT-4o)
#
# IMPORTANTE: Requer fila_viva rodando (shared-redis)
#   cd fila_viva && docker compose up -d

services:
  # ============================================
  # Atlas Supervisor API (Simplificado)
  # ============================================
  atlas-supervisor:
    build:
      context: .
      dockerfile: services/atlas_supervisor/Dockerfile
    container_name: caos-atlas-supervisor
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://shared-redis:6379/0
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import http.client,sys; c=http.client.HTTPConnection('localhost',8001,timeout=2); c.request('GET','/health'); r=c.getresponse(); sys.exit(0 if r.status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shared_redis
    restart: unless-stopped

  # ============================================
  # Stream Filter - Filtra telemetry.received → telemetry.validated
  # ============================================
  caos-filter:
    build:
      context: .
      dockerfile: services/atlas_supervisor/Dockerfile
    container_name: caos-stream-filter
    command: ["python", "services/atlas_supervisor/stream_consumer.py"]
    environment:
      - REDIS_URL=redis://shared-redis:6379/0
      - CAOS_INPUT_STREAM=telemetry.received
      - CAOS_OUTPUT_STREAM=telemetry.validated
      - CAOS_REJECTED_STREAM=telemetry.rejected
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    networks:
      - shared_redis
    restart: unless-stopped

  # ============================================
  # Routine Monitor - Monitora rotina diária do Atlas + sincronização
  # ============================================
  caos-routine-monitor:
    build:
      context: .
      dockerfile: services/atlas_supervisor/Dockerfile
    container_name: caos-routine-monitor
    command: ["python", "services/atlas_supervisor/routine_monitor.py"]
    environment:
      - REDIS_URL=redis://shared-redis:6379/0
      - CAOS_ROUTINE_STREAM=atlas.daily_routine
      - CAOS_SYNC_STREAM=atlas.db_sync
      - CAOS_ALERTS_STREAM=caos.alerts
      - EXPECTED_START_HOUR_UTC=10      # 07:00 BRT
      - DEADLINE_HOUR_UTC=11            # 08:00 BRT
      - SYNC_GRACE_PERIOD_MIN=30        # 30 min após deadline para sync
      - CHECK_INTERVAL_SEC=300          # 5 minutos
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    networks:
      - shared_redis
    restart: unless-stopped

  # ============================================
  # Consumer Health Monitor - Monitora saúde dos consumers
  # ============================================
  caos-consumer-monitor:
    build:
      context: .
      dockerfile: services/atlas_supervisor/Dockerfile
    container_name: caos-consumer-monitor
    command: ["python", "services/atlas_supervisor/consumer_health_monitor.py"]
    environment:
      - REDIS_URL=redis://shared-redis:6379/0
      - CAOS_CONSUMER_HEALTH_STREAM=sentinel.consumer_health
      - CAOS_ALERTS_STREAM=caos.alerts
      - MAX_ERROR_RATE_PERCENT=5        # Alerta se taxa de erro > 5%
      - MAX_INACTIVE_SECONDS=120        # Alerta se consumer inativo > 2 min
      - CHECK_INTERVAL_SEC=30           # Verifica a cada 30s
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    networks:
      - shared_redis
    restart: unless-stopped

networks:
  shared_redis:
    external: true
